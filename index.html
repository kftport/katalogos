<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stogiannos Logistics — Κατάλογος</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap&subset=greek,greek-ext" rel="stylesheet">
<style>
:root{--ink:#12241b;--forest:#17513a;--forest2:#0f3d2b;--lime:#7bc043;--paper:#ffffff;--card:#fff;--line:#e7e3d7;--muted:#6a7269}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:linear-gradient(155deg,var(--forest),var(--forest2));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(15,61,43,.18)}
.bar{display:flex;align-items:center;gap:11px;max-width:1240px;margin:0 auto}

.bar h1{font-family:'Sora';font-weight:600;font-size:15px;cursor:pointer} .bar p{font-size:11px;opacity:.82;margin-top:1px}
.ham{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;cursor:pointer;padding:4px 0;flex:none}
.ham-icon{font-size:22px;line-height:1}
.ham-label{font-family:'Sora';font-weight:600;font-size:13px;letter-spacing:.5px}
.logo-center{position:absolute;left:50%;transform:translateX(-50%);cursor:pointer;text-align:center}
.logo-center h1{font-family:'Sora';font-weight:600;font-size:15px}
.bar{position:relative;justify-content:flex-start}
.mode-tabs{display:flex;gap:6px;margin:0 2px 12px}
.mode-tab{font-family:'Sora';font-weight:600;font-size:12px;padding:7px 14px;border-radius:100px;background:var(--line);color:var(--muted);border:0;cursor:pointer;transition:all .15s}
.mode-tab.active{background:var(--forest);color:#fff}
.mode-tab:hover:not(.active){background:#d6ddd5}
.catalog-bar{display:flex;align-items:center;gap:0;margin:0 2px 14px;background:#f0f4ef;border-radius:14px;padding:5px;overflow:hidden}
.catalog-bar .cb-label{font-family:'Sora';font-weight:700;font-size:13px;color:var(--forest);padding:8px 16px;white-space:nowrap}
.catalog-bar .cb-tabs{display:flex;gap:4px}
.catalog-bar .cb-tab{font-family:'Sora';font-weight:600;font-size:12px;padding:8px 16px;border-radius:10px;border:0;cursor:pointer;transition:all .15s;white-space:nowrap;background:transparent;color:var(--muted)}
.catalog-bar .cb-tab.active{background:var(--forest);color:#fff;box-shadow:0 2px 8px rgba(23,81,58,.25)}
.catalog-bar .cb-tab:hover:not(.active){background:#e0e8de}
.sn-item.highlight{background:#d32f2f;color:#fff;font-family:'Sora';font-weight:700;font-size:16px;border-bottom:2px solid #b71c1c}
.sn-item.highlight:hover{background:#c62828}
.sn-item.highlight .sn-arrow{color:rgba(255,255,255,.7)}
.sn-mode-tabs{display:flex;gap:0;padding:0;border-bottom:2px solid var(--line);flex:none}
.sn-mode-tab{flex:1;padding:12px 0;text-align:center;font-family:'Sora';font-weight:600;font-size:13px;cursor:pointer;border:0;background:#f5f9f5;color:var(--muted);transition:all .15s}
.sn-mode-tab.active{background:#fff;color:var(--forest);box-shadow:inset 0 -3px 0 var(--forest)}
.sn-mode-tab:hover:not(.active){background:#eaf0ea}

main{max-width:1240px;margin:0 auto;padding:16px 16px 70px;min-height:60vh}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 2px 12px;font-size:14px;color:var(--muted)}
.crumb a{color:var(--forest);text-decoration:none;font-weight:600;cursor:pointer} .crumb .sep{opacity:.5}
.back{position:fixed;bottom:40px;left:20px;z-index:40;display:inline-flex;align-items:center;gap:9px;font-family:'Sora';font-weight:700;font-size:16px;color:#fff;background:var(--forest);border:0;border-radius:100px;padding:15px 26px;cursor:pointer;box-shadow:0 6px 20px rgba(15,61,43,.35);transition:transform .15s,box-shadow .15s,background .15s}
.back:hover{background:var(--forest2);box-shadow:0 8px 24px rgba(15,61,43,.45);transform:translateY(-2px)}
.eyebrow{display:inline-block;font-family:'Sora';font-weight:600;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--forest);background:#e7f0e6;padding:4px 10px;border-radius:100px;margin-bottom:8px}
.h-title{font-family:'Sora';font-weight:700;font-size:29px;margin:6px 2px 2px}
.h-sub{color:var(--muted);font-size:14px;margin:0 2px 16px}
.sec-label{font-family:'Sora';font-weight:600;font-size:15px;color:var(--muted);margin:18px 2px 10px;text-transform:uppercase;letter-spacing:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:15px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left}
.tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(18,36,27,.12);border-color:#cfe0cd}
.cover{aspect-ratio:16/10;display:grid;place-items:center;position:relative;overflow:hidden}
.cover.icon svg{width:52px;height:52px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.96;z-index:1}
.cover.icon::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 15%,rgba(255,255,255,.22),transparent 60%)}
.cover.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tile .meta{padding:13px 15px} .tile .meta h3{font-family:'Sora';font-weight:600;font-size:18px;line-height:1.25}
.tile .meta span{display:inline-block;margin-top:6px;font-size:13px;color:var(--forest2);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;cursor:zoom-in;aspect-ratio:1/1;display:grid;place-items:center;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(18,36,27,.10);border-color:#cfe0cd}
.card img{max-width:100%;max-height:100%;object-fit:contain}
.lb{position:fixed;inset:0;background:rgba(20,30,22,.90);display:none;z-index:60;place-items:center;padding:20px;touch-action:pan-y}
.lb.open{display:grid}
.lb .stage{position:relative;width:100%;max-width:820px;display:grid;place-items:center}
.lb img{max-width:90vw;max-height:82vh;background:#fff;border-radius:12px;padding:12px}
.lb-close{position:fixed;top:14px;right:18px;color:#fff;font-size:30px;font-family:'Sora';cursor:pointer;line-height:1}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;font-size:34px;cursor:pointer;user-select:none;font-family:'Sora'}
.lb-nav:hover{background:rgba(255,255,255,.28)}
.lb-nav.prev{left:-4px} .lb-nav.next{right:-4px}
.lb-count{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#fff;font-size:13px;opacity:.85;font-family:'Sora'}
@media(max-width:640px){.h-title{font-size:24px}.tile .meta h3{font-size:16px}.tiles{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}.cover.icon svg{width:42px;height:42px}.bar p{display:none}.lb-nav{width:44px;height:44px;font-size:28px}}


.nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;display:none}
.nav-overlay.open{display:block}
.side-nav{position:fixed;top:0;left:-320px;width:300px;max-width:85vw;height:100%;background:#fff;z-index:50;overflow-y:auto;transition:right .25s ease;box-shadow:4px 0 20px rgba(0,0,0,.2);display:flex;flex-direction:column}
.side-nav.open{left:0}
.sn-head{background:linear-gradient(155deg,var(--forest),var(--forest2));color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex:none}
.sn-head h2{font-family:'Sora';font-size:17px;font-weight:600}
.sn-close{font-size:24px;background:none;border:0;color:#fff;cursor:pointer;font-family:'Sora'}
.sn-search{padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.sn-search input{width:100%;padding:10px 14px;border:2px solid var(--line);border-radius:12px;font-size:14px;outline:none;font-family:'Inter';color:var(--muted)}
.sn-back{display:flex;align-items:center;gap:8px;padding:12px 20px;font-family:'Sora';font-weight:600;font-size:14px;color:var(--forest);cursor:pointer;border-bottom:2px solid var(--line);background:#f5f9f5;flex:none}
.sn-back:hover{background:#e7f0e6}
.sn-list{list-style:none;padding:0;overflow-y:auto;flex:1}
.sn-item{padding:14px 20px;font-size:15px;font-weight:500;cursor:pointer;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--ink)}
.sn-item:hover{background:#f0f6f0}
.sn-item:active{background:#e0ece0}
.sn-item .sn-arrow{color:var(--muted);font-size:18px}
.sn-item.active{color:var(--forest);font-weight:600;background:#f0f9f0}
</style></head><body>

const app=document.getElementById('app'),lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg'),lbCount=document.getElementById('lbCount');
let path=[];
function nodeAt(p){let n=TREE;for(const i of p)n=n.c[i];return n;}
function countImgs(n){return n.im.length+n.c.reduce((a,c)=>a+countImgs(c),0);}
function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function topColor(){if(!path.length)return null;return (ICONS[TREE.c[path[0]].n]||{}).c||'#4a9a3a';}
function cover(node,isTop){
 if(node.cv) return '<div class="cover photo"><img loading="lazy" src="covers/'+node.cv+'"></div>';
 let col,ic;
 if(isTop){const m=ICONS[node.n]||{};col=m.c||'#4a9a3a';ic=m.i||GEN;}
 else{col=topColor()||'#4a9a3a';ic=GEN;}
 return '<div class="cover icon" style="background:'+col+'"><svg viewBox="0 0 24 24">'+ic+'</svg></div>';
}
function goHome(){path=[];render();window.scrollTo(0,0);}
function go(i){path.push(i);render();window.scrollTo(0,0);}
function goTo(len){path=path.slice(0,len);render();window.scrollTo(0,0);}
function render(){
 app.innerHTML='';const cur=nodeAt(path),isHome=!path.length;
 if(isHome){
   const bar=el('<div class="catalog-bar"><span class="cb-label">Κατάλογος</span><div class="cb-tabs"><button class="cb-tab'+(MODE==='cat'?' active':'')+'">Ανά κατηγορία</button><button class="cb-tab'+(MODE==='brand'?' active':'')+'">Ανά εταιρία</button></div></div>');
   bar.querySelectorAll('.cb-tab')[0].onclick=()=>{if(MODE!=='cat'){MODE='cat';path=[];render();window.scrollTo(0,0);}};
   bar.querySelectorAll('.cb-tab')[1].onclick=()=>{if(MODE!=='brand'){MODE='brand';path=[];brandPath=[];renderBrands();window.scrollTo(0,0);}};
   app.appendChild(bar);
 } else {
   const cr=el('<div class="crumb"></div>');let h='<a onclick="goHome()">Κατηγορίες</a>',acc=[];
   path.forEach((idx,k)=>{acc.push(idx);const nm=nodeAt(acc.slice()).n;h+='<span class="sep">›</span>'+(k<path.length-1?'<a onclick="goTo('+(k+1)+')">'+nm+'</a>':nm);});
   cr.innerHTML=h;app.appendChild(cr);
   app.appendChild(el('<button class="back" onclick="goTo('+(path.length-1)+')">← Πίσω</button>'));
 }
 if(!isHome){
   app.appendChild(el('<span class="eyebrow">Κατηγορία</span>'));
 }
 app.appendChild(el('<h2 class="h-title">'+(isHome?'Κατηγορίες':cur.n)+'</h2>'));
 app.appendChild(el('<p class="h-sub">'+(cur.c.length?cur.c.length+' υποκατηγορίες':'')+'</p>'));
 if(cur.c.length){
   const t=el('<div class="tiles"></div>');
   cur.c.forEach((ch,i)=>{const tile=el('<button class="tile">'+cover(ch,isHome)+'<div class="meta"><h3>'+ch.n+'</h3></div></button>');tile.onclick=()=>go(i);t.appendChild(tile);});
   app.appendChild(t);
 }
 if(cur.im.length){
   if(cur.c.length)app.appendChild(el('<div class="sec-label">Προϊόντα</div>'));
   const g=el('<div class="grid"></div>');
   const imgs=cur.im;
   imgs.forEach((fn,ix)=>{const c=el('<button class="card"><img loading="lazy" src="images/'+fn+'"></button>');c.onclick=()=>openLB(imgs,ix);g.appendChild(c);});
   app.appendChild(g);
 }
}
/* gallery lightbox */
let GAL=[],GI=0;
function showLB(){lbimg.src='images/'+GAL[GI];lbCount.textContent=(GI+1)+' / '+GAL.length;}
function openLB(list,i){GAL=list;GI=i;showLB();lb.classList.add('open');}
function closeLB(){lb.classList.remove('open');lbimg.src='';}
function lbGo(d){GI=(GI+d+GAL.length)%GAL.length;showLB();}
document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();lbGo(-1);};
document.getElementById('lbNext').onclick=e=>{e.stopPropagation();lbGo(1);};
document.getElementById('lbClose').onclick=e=>{e.stopPropagation();closeLB();};
lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('stage'))closeLB();});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='ArrowLeft')lbGo(-1);else if(e.key==='ArrowRight')lbGo(1);else if(e.key==='Escape')closeLB();});
let tsx=0,tsy=0;
lb.addEventListener('touchstart',e=>{tsx=e.changedTouches[0].clientX;tsy=e.changedTouches[0].clientY;},{passive:true});
lb.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){lbGo(dx<0?1:-1);}},{passive:true});

   bar.querySelectorAll('.cb-tab')[0].onclick=()=>{MODE='cat';path=[];render();window.scrollTo(0,0);};

   app.appendChild(bar);
   app.appendChild(el('<h2 class="h-title">Εταιρίες</h2>'));
   app.appendChild(el('<p class="h-sub">'+BRANDS.length+' εταιρίες</p>'));
   const t=el('<div class="tiles"></div>');
   BRANDS.forEach((b,i)=>{
     const tile=el('<button class="tile"><div class="cover photo"><img loading="lazy" src="covers/'+b.cv+'"></div><div class="meta"><h3>'+b.n+'</h3></div></button>');
     tile.onclick=()=>{brandPath=[i];renderBrands();window.scrollTo(0,0);};
     t.appendChild(tile);
   });
   app.appendChild(t);
 } else {
   const b=BRANDS[brandPath[0]];
   const cr=el('<div class="crumb"><a onclick="brandPath=[];renderBrands();window.scrollTo(0,0)">Εταιρίες</a><span class="sep">›</span>'+b.n+'</div>');
   app.appendChild(cr);
   app.appendChild(el('<button class="back" onclick="brandPath=[];renderBrands();window.scrollTo(0,0)">← Πίσω</button>'));
   app.appendChild(el('<span class="eyebrow">Εταιρία</span>'));
   app.appendChild(el('<h2 class="h-title">'+b.n+'</h2>'));
   app.appendChild(el('<p class="h-sub"></p>'));
   const g=el('<div class="grid"></div>');
   b.im.forEach((fn,ix)=>{const c=el('<button class="card"><img loading="lazy" src="images/'+fn+'"></button>');c.onclick=()=>openLB(b.im,ix);g.appendChild(c);});
   app.appendChild(g);
 }
}

/* === Side Nav (drill-down) === */
let navLevel = [];
let navMode = 'cat';

function setNavMode(m) {
  navMode = m;
  navLevel = [];
  document.getElementById('snTabCat').className = 'sn-mode-tab' + (m === 'cat' ? ' active' : '');
  document.getElementById('snTabBrand').className = 'sn-mode-tab' + (m === 'brand' ? ' active' : '');
  renderNavList();
} // path inside the nav

function toggleNav() {
  const nav = document.getElementById('sideNav');
  const ov = document.getElementById('navOverlay');
  const opening = !nav.classList.contains('open');
  nav.classList.toggle('open');
  ov.classList.toggle('open');
  if (opening) { navLevel = []; navMode = MODE; setNavMode(navMode); }
}
function closeNav() {
  document.getElementById('sideNav').classList.remove('open');
  document.getElementById('navOverlay').classList.remove('open');
}

function navBack() {
  navLevel.pop();
  renderNavList();
}

function renderNavList() {
  const list = document.getElementById('snList');
  const backBtn = document.getElementById('snBack');
  list.innerHTML = '';
  
  if (navMode === 'brand') {
    backBtn.style.display = 'none';
    BRANDS.forEach((b, i) => {
      const li = document.createElement('li');
      li.className = 'sn-item';
      li.innerHTML = '<span>' + b.n + '</span>';
      li.onclick = () => { MODE = 'brand'; brandPath = [i]; renderBrands(); closeNav(); window.scrollTo(0, 0); };
      list.appendChild(li);
    });
    return;
  }
  
  let node = TREE;
  for (const i of navLevel) node = node.c[i];
  backBtn.style.display = navLevel.length ? 'flex' : 'none';
  
  node.c.forEach((ch, i) => {
    const li = document.createElement('li');
    const isSpecial = (navLevel.length === 0) && (ch.n === 'Νέα Είδη' || ch.n === 'Προσφορές');
    const hasExpandableSubs = ch.c.length > 0 && !isSpecial;
    
    li.className = 'sn-item' + (isSpecial ? ' highlight' : '');
    li.innerHTML = '<span>' + ch.n + '</span>' + (hasExpandableSubs ? '<span class="sn-arrow">›</span>' : '');
    
    li.onclick = () => {
      if (hasExpandableSubs) {
        navLevel.push(i);
        renderNavList();
      } else {
        path = [...navLevel, i];
        MODE = 'cat';
        render();
        closeNav();
        window.scrollTo(0, 0);
      }
    };
    list.appendChild(li);
  });
}

render();
